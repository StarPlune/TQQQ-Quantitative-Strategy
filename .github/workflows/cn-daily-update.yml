name: A-share ETF close update

on:
  schedule:
    - cron: '35 8 * * 1-5' # 16:35 Asia/Shanghai, after exchange close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cn-market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Strategy regression checks
        run: node --test tests/cn-strategy.test.cjs
      - name: Refresh verified completed-session quotes
        run: python scripts/update_cn_data.py
      - name: Verify generated snapshot
        run: node scripts/check_cn_data.cjs
      - name: Commit public market snapshot
        run: |
          if git diff --quiet -- docs/data/cn_market_data.json; then
            echo "No new verified data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/cn_market_data.json
          git commit -m "data: update A-share ETF close snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
